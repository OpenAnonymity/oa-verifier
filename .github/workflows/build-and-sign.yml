name: Deploy isolated production verifier
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
concurrency:
  group: oa-verifier-production-20260917
  cancel-in-progress: false
env:
  APP_REVISION: 144865c7b3cd85b5625f7ad7546f5939e0ccd40d
  RESOURCE_GROUP: oa-verifier
  CONTAINER_NAME: oa-verifier-production-20260917
  LOCATION: eastus
  TLS_DOMAIN: verifier-production-20260917.openanonymity.ai
  REGISTRY_URL: https://18-211-179-1.sslip.io
  ACR_REGISTRY: oaverifieracr.azurecr.io
  IMAGE_NAME: oa-verifier-production-20260917
jobs:
  deploy:
    if: github.ref == 'refs/heads/codex/oa-verifier-production-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: oa-production-20260917
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 144865c7b3cd85b5625f7ad7546f5939e0ccd40d
          path: app
          persist-credentials: false
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Check deployment isolation safeguards
        run: python3 -m unittest discover -s automation/deploy/production -p 'test_*.py'
      - name: Check exact resource and new DNS target
        env:
          CF_DNS_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PRODUCTION_REGISTRY_SECRET: ${{ secrets.PRODUCTION_REGISTRY_SECRET }}
        run: python3 automation/deploy/production/isolated.py preflight
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-24.05
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Test and reproducibly build pinned application
        working-directory: app
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_REVISION"
          nix develop --command go test ./...
          nix build .#container --print-build-logs
          docker load < result
      - uses: sigstore/cosign-installer@v3.7.0
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Publish and sign isolated image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          IMAGE_TAG="$ACR_REGISTRY/$IMAGE_NAME:$APP_REVISION-$GITHUB_RUN_ID"
          docker tag oa-verifier:latest "$IMAGE_TAG"
          docker push "$IMAGE_TAG"
          IMAGE_REF=$(docker inspect "$IMAGE_TAG" --format '{{index .RepoDigests 0}}')
          printf 'image_ref=%s\n' "$IMAGE_REF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$IMAGE_REF" > image-ref.txt
          cosign sign --yes "$IMAGE_REF" > cosign.log 2>&1
          python3 automation/deploy/production/isolated.py provenance
          cosign verify "$IMAGE_REF" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/build-and-sign.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > cosign-verification.json
      - name: Generate policy and private deployment document
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          PRODUCTION_REGISTRY_SECRET: ${{ secrets.PRODUCTION_REGISTRY_SECRET }}
          CF_DNS_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
        run: |
          set -euo pipefail
          umask 077
          az extension add --name confcom --yes --only-show-errors
          python3 automation/deploy/production/isolated.py prepare
      - name: Create only isolated confidential container
        run: python3 automation/deploy/production/isolated.py deploy
      - name: Add only dedicated DNS record
        env:
          CF_DNS_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 automation/deploy/production/isolated.py dns
      - name: Verify trusted TLS and signed hardware attestation
        run: |
          python3 -m pip install --quiet 'PyJWT[crypto]==2.10.1' 'requests==2.32.5'
          python3 automation/deploy/production/verify.py
      - name: Verify existing staging target unchanged
        run: python3 automation/deploy/production/isolated.py preserve
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oa-verifier-production-20260917-${{ github.run_id }}
          path: |
            production-record.json
            verification-result.json
            policy.rego
            cosign-verification.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove private deployment inputs
        if: always()
        run: python3 automation/deploy/production/isolated.py cleanup
