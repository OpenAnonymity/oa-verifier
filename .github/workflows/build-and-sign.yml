name: Staging verifier read-only diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    if: github.ref == 'refs/heads/codex/staging-verifier-diagnostics-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Read staging state and sanitized error categories
        run: python3 deploy/staging_diagnostics.py
      - uses: actions/upload-artifact@v4
        with:
          name: staging-verifier-diagnostics
          path: diagnostic-summary.json
          retention-days: 3
