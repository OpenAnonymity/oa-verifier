name: Build, Sign, and Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_recovery_test:
        description: 'Restart after this deployment to validate recovery (extra certificate issuance and station reauthentication may be required)'
        type: boolean
        required: false
        default: false

env:
  GHCR_REGISTRY: ghcr.io
  ACR_REGISTRY: oaverifieracr.azurecr.io
  IMAGE_NAME: oa-verifier
  RESOURCE_GROUP: oa-verifier
  CONTAINER_NAME: oa-verifier-2
  LOCATION: eastus

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test deployment safeguards
        run: python3 -m unittest discover -s tests/deployment -p 'test_*.py'

      - name: Check for code changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '**/*.nix'
              - 'flake.lock'
              - 'cmd/**'
              - 'internal/**'

      - name: Decide whether to build
        id: should-build
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "Manual dispatch -- always build"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "Tag push -- always build"
          elif [[ "${{ steps.changes.outputs.code }}" == "true" ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "Code files changed -- building"
          else
            echo "build=false" >> $GITHUB_OUTPUT
            echo "No code changes -- will reuse existing image"
          fi

      - name: Install Nix
        if: steps.should-build.outputs.build == 'true'
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-24.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run Go tests
        if: steps.should-build.outputs.build == 'true'
        run: nix develop --no-update-lock-file --command go test ./...

      - name: Build container with Nix (reproducible)
        if: steps.should-build.outputs.build == 'true'
        id: build
        run: |
          echo "Building container with Nix..."
          nix build --no-update-lock-file .#container --print-build-logs
          
          # Load the image into Docker
          docker load < result
          
          # Get image info
          IMAGE_ID=$(docker inspect oa-verifier:latest --format='{{.Id}}')
          echo "image_id=$IMAGE_ID" >> $GITHUB_OUTPUT
          echo "✅ Nix build complete. Image ID: $IMAGE_ID"

      - name: Install Cosign
        if: steps.should-build.outputs.build == 'true'
        uses: sigstore/cosign-installer@v3.7.0

      # --- Try GHCR first (works for public repos) ---
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && steps.should-build.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name != 'pull_request' && steps.should-build.outputs.build == 'true'
        id: push-ghcr
        continue-on-error: true  # May fail on private repos
        run: |
          # Lowercase the owner (Docker registries require lowercase)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          # Tag and push to GHCR
          docker tag oa-verifier:latest ${{ env.GHCR_REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}:latest
          docker tag oa-verifier:latest ${{ env.GHCR_REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          docker push ${{ env.GHCR_REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.GHCR_REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.GHCR_REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}:latest | cut -d'@' -f2)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "registry=${{ env.GHCR_REGISTRY }}/${OWNER}" >> $GITHUB_OUTPUT
          echo "✅ Pushed to GHCR with digest: $DIGEST"

      - name: Sign GHCR image with Cosign
        if: github.event_name != 'pull_request' && steps.should-build.outputs.build == 'true' && steps.push-ghcr.outcome == 'success'
        id: sign-ghcr
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.GHCR_REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}@${{ steps.push-ghcr.outputs.digest }}"
          echo "Signing: $IMAGE"
          OUTPUT=$(cosign sign --yes "$IMAGE" 2>&1)
          echo "$OUTPUT"

          # Extract Rekor tlog index from cosign output
          LOG_INDEX=$(echo "$OUTPUT" | grep -o 'tlog entry created with index: [0-9]*' | grep -o '[0-9]*')
          if [ -n "$LOG_INDEX" ]; then
            echo "rekor_log_index=$LOG_INDEX" >> $GITHUB_OUTPUT
            echo "✅ Rekor log index: $LOG_INDEX"

            # Fetch signing payload hash from Rekor using the log index
            PAYLOAD_HASH=$(curl -sS "https://rekor.sigstore.dev/api/v1/log/entries?logIndex=$LOG_INDEX" \
              | jq -r 'to_entries[0].value.body' \
              | base64 -d \
              | jq -r '.spec.data.hash | "\(.algorithm):\(.value)"')
            if [ -n "$PAYLOAD_HASH" ] && [ "$PAYLOAD_HASH" != "null:null" ]; then
              echo "signing_payload_hash=$PAYLOAD_HASH" >> $GITHUB_OUTPUT
              echo "✅ Signing payload hash: $PAYLOAD_HASH"
            else
              echo "⚠️ Could not extract signing payload hash from Rekor"
            fi
          else
            echo "⚠️ Could not extract Rekor log index from cosign output"
          fi

      # --- Always push to ACR (fallback, always works) ---
      - name: Log in to ACR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push to ACR
        if: github.event_name != 'pull_request' && steps.should-build.outputs.build == 'true'
        id: push-acr
        run: |
          # Tag and push to ACR
          docker tag oa-verifier:latest ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker tag oa-verifier:latest ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          docker push ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest | cut -d'@' -f2)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "registry=${{ env.ACR_REGISTRY }}" >> $GITHUB_OUTPUT
          echo "✅ Pushed to ACR with digest: $DIGEST"

      - name: Sign ACR image with Cosign
        if: github.event_name != 'pull_request' && steps.should-build.outputs.build == 'true'
        run: |
          IMAGE="${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push-acr.outputs.digest }}"
          echo "Signing: $IMAGE"
          cosign sign --yes "$IMAGE"

      # --- Pull existing image when skipping build ---
      - name: Pull existing image (no code changes)
        if: github.event_name != 'pull_request' && steps.should-build.outputs.build != 'true'
        id: pull-existing
        run: |
          docker pull ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker tag ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest oa-verifier:latest

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest | cut -d'@' -f2)
          IMAGE_ID=$(docker inspect oa-verifier:latest --format='{{.Id}}')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "image_id=$IMAGE_ID" >> $GITHUB_OUTPUT
          echo "Reusing existing image: $IMAGE_ID (digest: $DIGEST)"

      # --- Determine which registry and which pull authentication to deploy with ---
      #
      # Preference order (see deploy/README.md, "Why the pull credential matters"):
      #   1. ACR + user-assigned managed identity   when ACI_PULL_IDENTITY_ID is set
      #   2. GHCR, anonymous                        public image, nothing stored on the group
      #   3. ACR + admin credentials                private-repo fallback
      #
      # The image is pushed to ACR on every build and its manifest digest is the same as
      # the GHCR one (same local image, same manifest), so deploying from ACR does not
      # change what is measured -- only the registry host in the policy "id" differs.
      #
      # NEVER a job-scoped GITHUB_TOKEN: ACI stores the pull credential on the group and
      # re-uses it on every platform repair, long after the token has been revoked. That is
      # what took the service down on 2026-09-25, 09-27 and 09-28.
      - name: Select registry for deployment
        if: github.event_name != 'pull_request'
        id: registry
        env:
          ACI_PULL_IDENTITY_ID: ${{ vars.ACI_PULL_IDENTITY_ID || secrets.ACI_PULL_IDENTITY_ID }}
          BUILD: ${{ steps.should-build.outputs.build }}
          GHCR_PUSH_OUTCOME: ${{ steps.push-ghcr.outcome }}
          GHCR_DIGEST: ${{ steps.push-ghcr.outputs.digest }}
          ACR_DIGEST: ${{ steps.push-acr.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.pull-existing.outputs.digest }}
          GHCR_REKOR_LOG_INDEX: ${{ steps.sign-ghcr.outputs.rekor_log_index }}
          GHCR_SIGNING_PAYLOAD_HASH: ${{ steps.sign-ghcr.outputs.signing_payload_hash }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          REGISTRY=""
          DIGEST=""
          USE_GHCR=false
          USE_IDENTITY=false
          REKOR_LOG_INDEX=""
          SIGNING_PAYLOAD_HASH=""

          if [ -n "$ACI_PULL_IDENTITY_ID" ]; then
            echo "ACI_PULL_IDENTITY_ID is set -- deploying from ACR with managed-identity pull (no stored secret)"
            REGISTRY="${{ env.ACR_REGISTRY }}"
            USE_IDENTITY=true
            if [ "$BUILD" != "true" ]; then
              echo "Reusing existing ACR image (no code changes)"
              DIGEST="$EXISTING_DIGEST"
            else
              DIGEST="$ACR_DIGEST"
              # Keep the GHCR Sigstore/Rekor record for the attestation response, but only
              # when it provably describes the very digest ACI will pull.
              if [ "$GHCR_PUSH_OUTCOME" = "success" ] && [ -n "$GHCR_DIGEST" ] && [ "$GHCR_DIGEST" = "$ACR_DIGEST" ]; then
                REKOR_LOG_INDEX="$GHCR_REKOR_LOG_INDEX"
                SIGNING_PAYLOAD_HASH="$GHCR_SIGNING_PAYLOAD_HASH"
              elif [ "$GHCR_PUSH_OUTCOME" = "success" ]; then
                echo "::warning::GHCR digest ($GHCR_DIGEST) differs from ACR digest ($ACR_DIGEST); not attaching the GHCR Rekor record to this deployment"
              fi
            fi
          elif [ "$BUILD" != "true" ]; then
            echo "Reusing existing ACR image (no code changes); ACR admin credentials"
            REGISTRY="${{ env.ACR_REGISTRY }}"
            DIGEST="$EXISTING_DIGEST"
          elif [ "$GHCR_PUSH_OUTCOME" = "success" ]; then
            echo "Using GHCR for deployment (public image, anonymous pull)"
            REGISTRY="${{ env.GHCR_REGISTRY }}/${OWNER}"
            DIGEST="$GHCR_DIGEST"
            USE_GHCR=true
            REKOR_LOG_INDEX="$GHCR_REKOR_LOG_INDEX"
            SIGNING_PAYLOAD_HASH="$GHCR_SIGNING_PAYLOAD_HASH"
          else
            echo "Using ACR for deployment (private repo fallback, admin credentials)"
            REGISTRY="${{ env.ACR_REGISTRY }}"
            DIGEST="$ACR_DIGEST"
            REKOR_LOG_INDEX="$GHCR_REKOR_LOG_INDEX"
            SIGNING_PAYLOAD_HASH="$GHCR_SIGNING_PAYLOAD_HASH"
          fi

          if [ -z "$DIGEST" ]; then
            echo "❌ No image digest available for deployment (registry=$REGISTRY, build=$BUILD)"
            exit 1
          fi

          echo "Deploy registry: $REGISTRY"
          echo "Deploy digest:   $DIGEST"
          echo "Pull auth:       $( [ "$USE_IDENTITY" = "true" ] && echo "managed identity" || ( [ "$USE_GHCR" = "true" ] && echo "anonymous" || echo "ACR admin credentials" ) )"

          {
            echo "registry=$REGISTRY"
            echo "digest=$DIGEST"
            echo "use_ghcr=$USE_GHCR"
            echo "use_identity=$USE_IDENTITY"
            echo "pull_identity_id=$ACI_PULL_IDENTITY_ID"
            echo "rekor_log_index=$REKOR_LOG_INDEX"
            echo "signing_payload_hash=$SIGNING_PAYLOAD_HASH"
          } >> "$GITHUB_OUTPUT"

      # --- DEPLOY SECTION (same job, same runner, image already loaded) ---
      
      - name: Azure Login
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main')
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install confcom extension
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main')
        run: az extension add --name confcom --yes

      - name: Generate CCE policy from LOCAL image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main')
        id: policy
        env:
          DEPLOY_REGISTRY: ${{ steps.registry.outputs.registry }}
          DEPLOY_DIGEST: ${{ steps.registry.outputs.digest }}
          USE_GHCR: ${{ steps.registry.outputs.use_ghcr }}
          USE_IDENTITY: ${{ steps.registry.outputs.use_identity }}
          PULL_IDENTITY_ID: ${{ steps.registry.outputs.pull_identity_id }}
          REKOR_LOG_INDEX: ${{ steps.registry.outputs.rekor_log_index }}
          SIGSTORE_PAYLOAD_HASH: ${{ steps.registry.outputs.signing_payload_hash }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          LOG_ANALYTICS_WORKSPACE_ID: ${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}
          LOG_ANALYTICS_WORKSPACE_KEY: ${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}
        run: |
          echo "Generating CCE policy..."
          echo "Registry: $DEPLOY_REGISTRY"
          echo "Digest: $DEPLOY_DIGEST"
          echo "Pull auth: identity=$USE_IDENTITY ghcr-anonymous=$USE_GHCR"
          
          # Build image reference
          IMAGE_REF="${DEPLOY_REGISTRY}/${{ env.IMAGE_NAME }}@${DEPLOY_DIGEST}"
          echo "Image: $IMAGE_REF"
          
          # Pull authentication stored on the container group. All JSON fragments are
          # built with jq so quoting is always correct; nothing secret is echoed.
          #
          # The group keeps whatever is stored here for its whole life and re-uses it on
          # every platform repair. It must therefore be something that is still valid
          # months later: a managed identity, nothing at all (public image), or a
          # long-lived ACR admin credential. NEVER GITHUB_TOKEN: it is job-scoped and is
          # revoked as soon as this workflow finishes; the next repair then re-pulls with
          # a dead token, both containers sit in "Waiting" and the group fails with
          # DeploymentTimeout after 30 minutes (outages of 2026-09-25/27/28).
          IDENTITY_JSON=""
          if [ "$USE_IDENTITY" = "true" ]; then
            if [ -z "$PULL_IDENTITY_ID" ]; then
              echo "❌ use_identity=true but no identity resource id"
              exit 1
            fi
            # Identity-based pull: the group gets the user-assigned identity and the
            # registry credential references it. No username, no password.
            CREDS_JSON=$(jq -cn --arg server "${{ env.ACR_REGISTRY }}" --arg id "$PULL_IDENTITY_ID" \
              '[{server: $server, identity: $id}]')
            IDENTITY_OBJ=$(jq -cn --arg id "$PULL_IDENTITY_ID" \
              '{type: "UserAssigned", userAssignedIdentities: {($id): {}}}')
            IDENTITY_JSON="\"identity\": ${IDENTITY_OBJ},"
          elif [ "$USE_GHCR" = "true" ]; then
            # GHCR - the image is public, pull anonymously.
            CREDS_JSON='[]'
          else
            # ACR admin credentials (long-lived) - fallback when no identity is configured.
            CREDS_JSON=$(jq -cn --arg server "${{ env.ACR_REGISTRY }}" --arg u "$ACR_USERNAME" --arg p "$ACR_PASSWORD" \
              '[{server: $server, username: $u, password: $p}]')
          fi

          # Optional Log Analytics diagnostics (deploy template only - never part of the
          # measured policy). Confidential containers cannot write stdout/stderr, but the
          # ContainerEvent table still records pulls, starts, repairs and their failures,
          # which is exactly the evidence that was missing during the 2026-09 outages.
          DIAG_JSON=""
          if [ -n "$LOG_ANALYTICS_WORKSPACE_ID" ] && [ -n "$LOG_ANALYTICS_WORKSPACE_KEY" ]; then
            DIAG_OBJ=$(jq -cn --arg id "$LOG_ANALYTICS_WORKSPACE_ID" --arg key "$LOG_ANALYTICS_WORKSPACE_KEY" \
              '{logAnalytics: {workspaceId: $id, workspaceKey: $key, logType: "ContainerInstanceLogs"}}')
            DIAG_JSON="\"diagnostics\": ${DIAG_OBJ},"
            echo "Log Analytics diagnostics: enabled"
          else
            echo "Log Analytics diagnostics: not configured (LOG_ANALYTICS_WORKSPACE_ID/KEY unset)"
          fi

          # Liveness probe for the oa-verifier container (both templates, so the CCE
          # policy is generated from the same container spec that is deployed).
          # /health is unauthenticated, returns 200, and GetCertificate ignores SNI so the
          # probe's SNI-less HTTPS handshake succeeds.
          # initialDelaySeconds is generous on purpose: the server only opens :443 AFTER
          # the ACME DNS-01 issuance has finished (or fallen back to self-signed), and a
          # probe that kills the container mid-issuance would loop and burn the Let's
          # Encrypt duplicate-certificate quota. Tighten only after the app serves a
          # self-signed cert while ACME is pending.
          PROBE_JSON='"livenessProbe": {"httpGet": {"path": "/health", "port": 443, "scheme": "https"}, "initialDelaySeconds": 300, "periodSeconds": 30, "failureThreshold": 3, "timeoutSeconds": 10},'

          # Step 1: Create MINIMAL ARM template for policy generation
          # IMPORTANT: Do NOT include secret env vars here - they would be captured in the policy!
          # Only include non-secret env vars that have fixed values.
          cat > /tmp/aci-policy-template.json << EOF
          {
            "\$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#",
            "contentVersion": "1.0.0.0",
            "resources": [{
              "type": "Microsoft.ContainerInstance/containerGroups",
              "apiVersion": "2023-05-01",
              "name": "oa-verifier-2",
              "location": "eastus",
              ${IDENTITY_JSON}
              "properties": {
                "sku": "Confidential",
                "containers": [{
                  "name": "oa-verifier",
                  "properties": {
                    "image": "${IMAGE_REF}",
                    "ports": [{"port": 443, "protocol": "TCP"}],
                    ${PROBE_JSON}
                    "environmentVariables": [
                      {"name": "MAA_ENDPOINT", "value": "http://localhost:8080/attest/maa"},
                      {"name": "MAA_PROVIDER_URL", "value": "sharedeus.eus.attest.azure.net"}
                    ],
                    "resources": {"requests": {"cpu": 1.0, "memoryInGB": 2.0}}
                  }
                },{
                  "name": "skr-sidecar",
                  "properties": {
                    "image": "mcr.microsoft.com/aci/skr@sha256:baa6acf093c011cb26799187b6a535e32bd8248f52dd2cd9c606732b8a23c112",
                    "command": ["/skr.sh"],
                    "ports": [{"port": 8080, "protocol": "TCP"}],
                    "resources": {"requests": {"cpu": 0.5, "memoryInGB": 1.0}}
                  }
                }],
                "imageRegistryCredentials": ${CREDS_JSON},
                "ipAddress": {
                  "type": "Public",
                  "ports": [{"port": 443, "protocol": "TCP"}],
                  "dnsNameLabel": "oa-verifier-2"
                },
                "osType": "Linux",
                "restartPolicy": "Always",
                "confidentialComputeProperties": {"ccePolicy": ""}
              }
            }]
          }
          EOF

          jq empty /tmp/aci-policy-template.json || { echo "❌ policy template is not valid JSON"; exit 1; }

          # Step 2: Generate base CCE policy from minimal template (no secrets!)
          az confcom acipolicygen -a /tmp/aci-policy-template.json --approve-wildcards
          
          # Step 3: Extract and modify policy to add regex rules for dynamic env vars
          BASE_POLICY_B64=$(jq -r '.resources[0].properties.confidentialComputeProperties.ccePolicy' /tmp/aci-policy-template.json)
          BASE_POLICY=$(echo "$BASE_POLICY_B64" | base64 -d)
          
          # Add regex rules for env vars that will be set at runtime
          # These use .+ patterns so the actual values are NOT captured in the policy
          MODIFIED_POLICY=$(echo "$BASE_POLICY" | python3 -c '
          import sys
          import json
          import re
          
          policy = sys.stdin.read()
          
          # Find the containers JSON array in the Rego policy
          match = re.search(r"containers := (\[.*?\])\s*\n\nallow_properties", policy, re.DOTALL)
          if not match:
              match = re.search(r"containers := (\[.*?\])(?=\s*\n\n|\s*$)", policy, re.DOTALL)
          
          if match:
              containers_json = match.group(1)
              containers = json.loads(containers_json)
              
              # Add regex env rules to oa-verifier container (first one)
              if containers and "env_rules" in containers[0]:
                  # These env vars use regex patterns - actual values stay secret!
                  # Required vars use .+ (must have value), optional use .* (can be empty)
                  required_env_vars = [
                      "CCE_POLICY_B64",
                      "STATION_REGISTRY_URL",
                      "STATION_REGISTRY_SECRET",
                      "CHALLENGE_MIN_INTERVAL",
                      "CHALLENGE_MAX_INTERVAL"
                  ]
                  optional_env_vars = [
                      "MAX_CONCURRENT_REQUESTS",
                      "RATE_LIMIT_RPS",
                      "RATE_LIMIT_BURST",
                      "SUBMIT_KEY_OWNERSHIP_GRACE_SECONDS",
                      "TLS_DOMAIN",
                      "ACME_EMAIL",
                      "ACME_DNS_PROVIDER",
                      "CF_DNS_API_TOKEN",
                      "CF_ZONE_API_TOKEN",
                      "REKOR_LOG_INDEX",
                      "SIGSTORE_PAYLOAD_HASH"
                  ]
                  for env_var in required_env_vars:
                      containers[0]["env_rules"].append({
                          "pattern": f"{env_var}=.+",
                          "required": False,
                          "strategy": "re2"
                      })
                  for env_var in optional_env_vars:
                      containers[0]["env_rules"].append({
                          "pattern": f"{env_var}=.*",
                          "required": False,
                          "strategy": "re2"
                      })

              new_containers_json = json.dumps(containers, separators=(",", ":"))
              policy = policy[:match.start(1)] + new_containers_json + policy[match.end(1):]

          print(policy)
          ')

          # Step 4: Encode modified policy and compute hash
          POLICY_B64=$(echo "$MODIFIED_POLICY" | base64 -w0)
          POLICY_HASH=$(echo "$MODIFIED_POLICY" | sha256sum | cut -d' ' -f1)
          
          # Step 5: Create DEPLOYMENT template with secrets and CCE_POLICY_B64
          # This template has the actual env var values but uses the policy with regex rules
          cat > /tmp/aci-deploy.json << DEPLOY_EOF
          {
            "\$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#",
            "contentVersion": "1.0.0.0",
            "resources": [{
              "type": "Microsoft.ContainerInstance/containerGroups",
              "apiVersion": "2023-05-01",
              "name": "oa-verifier-2",
              "location": "eastus",
              ${IDENTITY_JSON}
              "properties": {
                "sku": "Confidential",
                "containers": [{
                  "name": "oa-verifier",
                  "properties": {
                    "image": "${IMAGE_REF}",
                    "ports": [{"port": 443, "protocol": "TCP"}],
                    ${PROBE_JSON}
                    "environmentVariables": [
                      {"name": "MAA_ENDPOINT", "value": "http://localhost:8080/attest/maa"},
                      {"name": "MAA_PROVIDER_URL", "value": "sharedeus.eus.attest.azure.net"},
                      {"name": "CCE_POLICY_B64", "value": "${POLICY_B64}"},
                      {"name": "STATION_REGISTRY_URL", "value": "${{ secrets.STATION_REGISTRY_URL }}"},
                      {"name": "STATION_REGISTRY_SECRET", "secureValue": "${{ secrets.STATION_REGISTRY_SECRET }}"},
                      {"name": "CHALLENGE_MIN_INTERVAL", "value": "${{ secrets.CHALLENGE_MIN_INTERVAL }}"},
                      {"name": "CHALLENGE_MAX_INTERVAL", "value": "${{ secrets.CHALLENGE_MAX_INTERVAL }}"},
                      {"name": "MAX_CONCURRENT_REQUESTS", "value": "${{ secrets.MAX_CONCURRENT_REQUESTS }}"},
                      {"name": "RATE_LIMIT_RPS", "value": "${{ secrets.RATE_LIMIT_RPS }}"},
                      {"name": "RATE_LIMIT_BURST", "value": "${{ secrets.RATE_LIMIT_BURST }}"},
                      {"name": "SUBMIT_KEY_OWNERSHIP_GRACE_SECONDS", "value": "${{ secrets.SUBMIT_KEY_OWNERSHIP_GRACE_SECONDS }}"},
                      {"name": "TLS_DOMAIN", "value": "${{ secrets.TLS_DOMAIN }}"},
                      {"name": "ACME_EMAIL", "value": "${{ secrets.ACME_EMAIL }}"},
                      {"name": "ACME_DNS_PROVIDER", "value": "${{ secrets.ACME_DNS_PROVIDER }}"},
                      {"name": "CF_DNS_API_TOKEN", "secureValue": "${{ secrets.CF_API_TOKEN }}"},
                      {"name": "REKOR_LOG_INDEX", "value": "${REKOR_LOG_INDEX}"},
                      {"name": "SIGSTORE_PAYLOAD_HASH", "value": "${SIGSTORE_PAYLOAD_HASH}"}
                    ],
                    "resources": {"requests": {"cpu": 1.0, "memoryInGB": 2.0}}
                  }
                },{
                  "name": "skr-sidecar",
                  "properties": {
                    "image": "mcr.microsoft.com/aci/skr@sha256:baa6acf093c011cb26799187b6a535e32bd8248f52dd2cd9c606732b8a23c112",
                    "command": ["/skr.sh"],
                    "ports": [{"port": 8080, "protocol": "TCP"}],
                    "resources": {"requests": {"cpu": 0.5, "memoryInGB": 1.0}}
                  }
                }],
                "imageRegistryCredentials": ${CREDS_JSON},
                "ipAddress": {
                  "type": "Public",
                  "ports": [{"port": 443, "protocol": "TCP"}],
                  "dnsNameLabel": "oa-verifier-2"
                },
                "osType": "Linux",
                "restartPolicy": "Always",
                ${DIAG_JSON}
                "confidentialComputeProperties": {"ccePolicy": "${POLICY_B64}"}
              }
            }]
          }
          DEPLOY_EOF

          jq empty /tmp/aci-deploy.json || { echo "❌ deployment template is not valid JSON"; exit 1; }

          echo "policy_hash=$POLICY_HASH" >> $GITHUB_OUTPUT
          echo "policy_b64=$POLICY_B64" >> $GITHUB_OUTPUT
          echo "✅ Policy hash: $POLICY_HASH"
          echo "✅ CCE_POLICY_B64 env var added to deployment template"

      # Guardrail: refuse to deploy a group whose stored pull credential will not survive
      # this job. The container group keeps imageRegistryCredentials for its whole life
      # and re-uses them on every platform-initiated repair (host maintenance, UVM move).
      # A job-scoped GITHUB_TOKEN is revoked the moment this job ends, so the next repair
      # re-pulls with a dead token: GHCR answers 403, ACI does not fall back to anonymous,
      # both containers stay "Waiting" and the group dies with DeploymentTimeout after
      # 30 minutes. That is exactly what happened on 2026-09-25, 09-27 and 09-28.
      #
      # Runs BEFORE the existing group is deleted: a refused deploy must leave the
      # currently running group untouched instead of causing the outage it prevents.
      - name: Guardrail -- no ephemeral pull credentials on the container group
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main')
        env:
          JOB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_IDENTITY: ${{ steps.registry.outputs.use_identity }}
          USE_GHCR: ${{ steps.registry.outputs.use_ghcr }}
        run: |
          TEMPLATE=/tmp/aci-deploy.json
          CREDS=$(jq -c '.resources[0].properties.imageRegistryCredentials // []' "$TEMPLATE")
          echo "imageRegistryCredentials (secrets redacted):"
          echo "$CREDS" | jq -c 'map(if has("password") then .password = "<redacted>" else . end)'

          FAIL=0

          # 1. A public GHCR image must be pulled anonymously. Any password stored for
          #    ghcr.io is either GITHUB_TOKEN (dies with the job) or a PAT (expires and
          #    is tied to a person); both eventually leave the group unable to repair.
          if echo "$CREDS" | jq -e 'any(.[]; ((.server // "") | ascii_downcase | startswith("ghcr.io")) and has("password"))' >/dev/null; then
            echo "❌ A password is stored for ghcr.io. The image is public: pull it anonymously (imageRegistryCredentials: [])."
            FAIL=1
          fi

          # 2. No credential may equal this job's GITHUB_TOKEN, for any registry. The
          #    token is compared inside jq via --arg and is never printed.
          if [ -n "$JOB_TOKEN" ] && echo "$CREDS" | jq -e --arg tok "$JOB_TOKEN" 'any(.[]; (.password // "") == $tok)' >/dev/null; then
            echo "❌ A stored pull credential equals the job-scoped GITHUB_TOKEN. GitHub revokes it when this job ends; ACI would keep it forever and every future platform repair would fail to pull."
            FAIL=1
          fi
          # ... and not anywhere else in the template either (env vars, identity, ...).
          if [ -n "$JOB_TOKEN" ] && grep -qF -- "$JOB_TOKEN" "$TEMPLATE"; then
            echo "❌ The job-scoped GITHUB_TOKEN appears somewhere in the deployment template."
            FAIL=1
          fi

          # 3. Identity-based entries must not also carry a username/password, and an
          #    identity deployment must actually declare the identity on the group.
          if echo "$CREDS" | jq -e 'any(.[]; has("identity") and (has("password") or has("username")))' >/dev/null; then
            echo "❌ A credential mixes identity and username/password."
            FAIL=1
          fi
          if [ "$USE_IDENTITY" = "true" ]; then
            if ! jq -e '.resources[0].identity.type == "UserAssigned" and ((.resources[0].identity.userAssignedIdentities | length) == 1)' "$TEMPLATE" >/dev/null; then
              echo "❌ use_identity=true but the group has no UserAssigned identity block."
              FAIL=1
            fi
            if ! echo "$CREDS" | jq -e 'length == 1 and all(.[]; has("identity") and (has("password") | not))' >/dev/null; then
              echo "❌ use_identity=true but imageRegistryCredentials is not a single identity-only entry."
              FAIL=1
            fi
          fi
          if [ "$USE_GHCR" = "true" ] && [ "$CREDS" != "[]" ]; then
            echo "❌ GHCR deployment must carry no imageRegistryCredentials at all."
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "Refusing to deploy. Why this matters: the credential stored on the container group"
            echo "outlives this job and is what the platform uses to re-pull both images whenever it"
            echo "repairs or moves the group. Fix the credential selection instead of bypassing this step."
            exit 1
          fi
          echo "✅ Pull credentials are durable (identity, anonymous, or long-lived ACR credential)."

      - name: Delete existing container group
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main')
        run: |
          if az container show --name ${{ env.CONTAINER_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} &>/dev/null; then
            echo "Deleting existing container group..."
            az container delete --name ${{ env.CONTAINER_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --yes
            sleep 30
          fi

      - name: Deploy to Azure
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main')
        run: |
          echo "Deploying to Azure..."
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file /tmp/aci-deploy.json

      - name: Wait for container
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main')
        run: |
          echo "Waiting for container to start..."
          sleep 90

      # Optional post-deploy recovery test. Restart once during a chosen validation
      # deployment. Running containers prove process recovery; Azure Pulling/Pulled
      # events are needed separately to prove image downloads. Also observe a repair
      # after the workflow job ends to rule out dependence on its temporary token.
      #
      # Trade-off: the app re-issues its Let's Encrypt certificate on every start (no
      # persistent volume), so this restart costs one extra issuance per deploy against
      # the 5-per-week duplicate-certificate limit. Set repository variable
      # ACI_SKIP_RECOVERY_TEST=true to prohibit it. Ordinary pushes and self-heal
      # never request this test. A manual dispatch must explicitly opt in for that
      # one run; the input defaults back to false on the next dispatch.
      - name: Recovery test (explicit restart)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_recovery_test == true && vars.ACI_SKIP_RECOVERY_TEST != 'true'
        id: recovery
        run: |
          echo "Restarting ${{ env.CONTAINER_NAME }} for this explicitly requested recovery test..."
          az container restart --name ${{ env.CONTAINER_NAME }} --resource-group ${{ env.RESOURCE_GROUP }}

          DEADLINE=$((SECONDS + 300))
          RESULT="timeout"
          while :; do
            STATE=$(az container show --name ${{ env.CONTAINER_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "{provisioningState: provisioningState, containers: containers[].{name: name, state: instanceView.currentState.state, detail: instanceView.currentState.detailStatus, restarts: instanceView.restartCount}}" \
              -o json 2>/dev/null || echo '{}')
            PROV=$(echo "$STATE" | jq -r '.provisioningState // "unknown"')
            TOTAL=$(echo "$STATE" | jq -r '.containers // [] | length')
            NOT_RUNNING=$(echo "$STATE" | jq -r '[(.containers // [])[] | select(.state != "Running")] | length')
            echo "$(date -u +%H:%M:%S) provisioningState=$PROV running=$((TOTAL - NOT_RUNNING))/$TOTAL"

            if [ "$PROV" = "Succeeded" ] && [ "$TOTAL" -eq 2 ] && [ "$NOT_RUNNING" -eq 0 ]; then
              RESULT="ok"
              break
            fi
            if [ "$PROV" = "Failed" ]; then
              RESULT="failed"
              break
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              break
            fi
            sleep 15
          done

          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          if [ "$RESULT" != "ok" ]; then
            echo "❌ Recovery test $RESULT: the group did not return to Succeeded with both containers Running within 5 minutes after a restart."
            echo "Last observed state:"
            echo "$STATE" | jq .
            echo "Recent events:"
            az container show --name ${{ env.CONTAINER_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "containers[].{name: name, events: instanceView.events}" -o json 2>/dev/null || true
            echo ""
            echo "This is the path a platform repair takes; a group that cannot re-pull its images now"
            echo "will not recover from the next repair either."
            exit 1
          fi
          echo "✅ Recovery test passed: both containers are Running after restart. Check Azure pull events separately."
          # The app re-runs its ACME issuance after the restart before it opens :443; give it
          # the same head start the initial "Wait for container" step gives (the TLS check
          # below also retries 8 x 15s on its own).
          sleep 90

      - name: Check origin TLS certificate (ACME vs fallback)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main')
        id: origin_cert
        run: |
          FQDN=$(az container show --name ${{ env.CONTAINER_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query "ipAddress.fqdn" -o tsv)
          if [ -z "$FQDN" ]; then
            echo "❌ Could not determine Azure origin FQDN"
            exit 1
          fi

          if [ -n "${{ secrets.TLS_DOMAIN }}" ]; then
            SNI="${{ secrets.TLS_DOMAIN }}"
          else
            SNI="$FQDN"
          fi

          echo "Inspecting origin cert directly (bypasses Cloudflare edge certs)"
          echo "Origin FQDN: $FQDN"
          echo "SNI: $SNI"

          CERT_FILE=/tmp/origin-cert.pem
          FOUND_CERT=false

          for i in {1..8}; do
            echo "TLS cert fetch attempt $i/8..."
            if echo | openssl s_client -connect "${FQDN}:443" -servername "$SNI" -showcerts 2>/dev/null \
              | awk '/-----BEGIN CERTIFICATE-----/{flag=1} flag{print} /-----END CERTIFICATE-----/{exit}' > "$CERT_FILE"; then
              if [ -s "$CERT_FILE" ]; then
                FOUND_CERT=true
                break
              fi
            fi
            sleep 15
          done

          if [ "$FOUND_CERT" != "true" ]; then
            echo "❌ Could not retrieve origin TLS certificate after retries"
            exit 1
          fi

          ISSUER=$(openssl x509 -in "$CERT_FILE" -noout -issuer | sed 's/^issuer=//')
          SUBJECT=$(openssl x509 -in "$CERT_FILE" -noout -subject | sed 's/^subject=//')
          NOT_BEFORE=$(openssl x509 -in "$CERT_FILE" -noout -startdate | cut -d= -f2-)
          NOT_AFTER=$(openssl x509 -in "$CERT_FILE" -noout -enddate | cut -d= -f2-)
          SERIAL=$(openssl x509 -in "$CERT_FILE" -noout -serial | cut -d= -f2-)
          FINGERPRINT_SHA256=$(openssl x509 -in "$CERT_FILE" -noout -fingerprint -sha256 | cut -d= -f2)
          SAN_LINE=$(openssl x509 -in "$CERT_FILE" -noout -ext subjectAltName | tail -n +2 | tr '\n' ' ' | sed 's/  */ /g')

          CERT_STATUS="non-letsencrypt"
          if echo "$ISSUER" | grep -qi "let's encrypt"; then
            CERT_STATUS="letsencrypt"
          elif [ "$ISSUER" = "$SUBJECT" ]; then
            CERT_STATUS="self-signed"
          fi

          SAN_OK="unknown"
          if [ -n "${{ secrets.TLS_DOMAIN }}" ]; then
            if echo "$SAN_LINE" | grep -Fq "${{ secrets.TLS_DOMAIN }}"; then
              SAN_OK="yes"
            else
              SAN_OK="no"
            fi
          fi

          echo "issuer=$ISSUER" >> $GITHUB_OUTPUT
          echo "subject=$SUBJECT" >> $GITHUB_OUTPUT
          echo "not_before=$NOT_BEFORE" >> $GITHUB_OUTPUT
          echo "not_after=$NOT_AFTER" >> $GITHUB_OUTPUT
          echo "serial=$SERIAL" >> $GITHUB_OUTPUT
          echo "fingerprint_sha256=$FINGERPRINT_SHA256" >> $GITHUB_OUTPUT
          echo "cert_status=$CERT_STATUS" >> $GITHUB_OUTPUT
          echo "san_ok=$SAN_OK" >> $GITHUB_OUTPUT

          echo ""
          echo "=========================================="
          echo "  ORIGIN TLS CERTIFICATE CHECK"
          echo "=========================================="
          echo "Status:        $CERT_STATUS"
          echo "Issuer:        $ISSUER"
          echo "Subject:       $SUBJECT"
          echo "Not Before:    $NOT_BEFORE"
          echo "Not After:     $NOT_AFTER"
          echo "Serial:        $SERIAL"
          echo "SHA256 FP:     $FINGERPRINT_SHA256"
          echo "SANs:          $SAN_LINE"
          if [ -n "${{ secrets.TLS_DOMAIN }}" ]; then
            echo "Has TLS_DOMAIN SAN (${{ secrets.TLS_DOMAIN }}): $SAN_OK"
          fi

          if [ "$CERT_STATUS" != "letsencrypt" ]; then
            echo "⚠️ Origin certificate is not Let's Encrypt (likely ACME fallback)"
          fi

      - name: Fetch container logs (ACME debug)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main')
        run: |
          echo "=============================================="
          echo "  CONTAINER LOGS (ACME DEBUG)"
          echo "=============================================="
          echo ""
          echo "Certificate status: ${{ steps.origin_cert.outputs.cert_status }}"
          echo "Expected: letsencrypt"
          echo ""
          echo "--- oa-verifier container logs ---"
          az container logs \
            --name ${{ env.CONTAINER_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --container-name oa-verifier \
            2>&1 || echo "(failed to fetch oa-verifier logs)"
          echo ""
          echo "--- container state ---"
          az container show \
            --name ${{ env.CONTAINER_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "containers[].{name:name, state:instanceView.currentState}" \
            -o json 2>&1 || echo "(failed to fetch container details)"

      - name: Verify attestation matches local build
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main')
        env:
          EXPECTED_HASH: ${{ steps.policy.outputs.policy_hash }}
        run: |
          FQDN=$(az container show --name ${{ env.CONTAINER_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query "ipAddress.fqdn" -o tsv)
          echo "Fetching attestation from: https://$FQDN"

          NONCE="verify-$(date +%s)"
          ATTESTATION=$(curl -sfk "https://$FQDN/attestation?nonce=$NONCE" 2>/dev/null || echo "{}")

          if [ -z "$ATTESTATION" ] || [ "$ATTESTATION" = "{}" ]; then
            echo "⚠️ Could not fetch attestation - container may still be starting"
            echo "Expected hash was: $EXPECTED_HASH"
            exit 0
          fi

          TOKEN=$(echo "$ATTESTATION" | jq -r '.token // empty')
          VERIFY_AT=$(echo "$ATTESTATION" | jq -r '.verify_at // empty')
          if [ -z "$TOKEN" ] || [ -z "$VERIFY_AT" ]; then
            echo "❌ Missing token or verify_at in attestation payload"
            exit 1
          fi

          bash scripts/verify-jwt.sh "$TOKEN" "$VERIFY_AT" "$NONCE"

          REMOTE_HASH=$(echo "$ATTESTATION" | jq -r '.summary.cce_policy_hash // .summary.host_data')
          echo ""
          echo "=========================================="
          echo "  ZERO-TRUST VERIFICATION"
          echo "=========================================="
          echo "Expected (local Nix build): $EXPECTED_HASH"
          echo "Remote (from attestation):  $REMOTE_HASH"
          echo ""
          
          if [ "$EXPECTED_HASH" = "$REMOTE_HASH" ]; then
            echo "✅ VERIFICATION PASSED!"
            echo "The deployed code matches what was built from source."
            echo "JWT signature and nonce were verified against Azure Attestation keys."
          else
            echo "❌ VERIFICATION FAILED!"
            echo "Hashes do not match!"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Build & Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Nix Build | ✅ ${{ steps.build.outputs.image_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GHCR Push | ${{ steps.push-ghcr.outcome == 'success' && '✅' || '⏭️ skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ACR Push | ✅ ${{ steps.push-acr.outputs.digest }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Registry | ${{ steps.registry.outputs.registry }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pull Auth | ${{ steps.registry.outputs.use_identity == 'true' && 'managed identity' || (steps.registry.outputs.use_ghcr == 'true' && 'anonymous (public image)' || 'ACR admin credentials') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Recovery Test (restart) | ${{ steps.recovery.outputs.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Policy Hash | ${{ steps.policy.outputs.policy_hash }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Origin Cert Status | ${{ steps.origin_cert.outputs.cert_status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Origin Cert Not Before | ${{ steps.origin_cert.outputs.not_before }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Origin Cert Not After | ${{ steps.origin_cert.outputs.not_after }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Origin Cert SHA256 | ${{ steps.origin_cert.outputs.fingerprint_sha256 }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.origin_cert.outputs.cert_status }}" != "letsencrypt" ] && [ -n "${{ steps.origin_cert.outputs.cert_status }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ACME Debug" >> $GITHUB_STEP_SUMMARY
            echo "Origin cert is **${{ steps.origin_cert.outputs.cert_status }}** (not Let's Encrypt). Check the 'Fetch container logs (ACME debug)' step for details." >> $GITHUB_STEP_SUMMARY
          fi

  # Rebuild and check the exact live image without passing secret-filtered outputs.
  verify:
    needs: build-and-deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify-attestation.yml
    with:
      source_revision: ${{ github.sha }}
    secrets: inherit
