name: Staging encrypted storage readiness
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [diagnose, recover]
        default: diagnose
      confirm_recovery:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verifier2-runtime-mutation
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/staging-provider-grace-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Inspect or restore only the known staging deployment
        env:
          RECOVERY_OPERATION: ${{ inputs.operation || 'diagnose' }}
          CONFIRM_RECOVERY: ${{ inputs.confirm_recovery }}
        run: python3 scripts/staging_recovery.py
